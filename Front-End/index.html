<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Resume Matcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Find the Best Candidate</h1>

    <!-- ─────────── Job form ─────────── -->
    <form id="job-form">
      <label>
        Job Title
        <input type="text" name="role" required />
      </label>

      <label>
        Description
        <textarea name="description" rows="4" required></textarea>
      </label>

      <label>
        Qualifications (one per line)
        <textarea name="qualifications" rows="3"></textarea>
      </label>

      <label>
        Preferences (one per line)
        <textarea name="preferences" rows="3"></textarea>
      </label>

      <label class="file-label">
        Résumé PDFs
        <input type="file" id="resumes" name="resumes" accept=".pdf" multiple required />
      </label>

      <button type="submit" id="submit-btn">Find Best Match</button>
    </form>

    <!-- ─────────── Result panel ─────────── -->
    <section id="result" hidden>
      <h2>Top Recommendation</h2>
      <p><strong>Candidate:</strong> <span id="result-candidate"></span></p>
      <p><strong>Fit Score:</strong> <span id="result-score"></span>/10</p>
      <p><strong>Why?</strong> <span id="result-reason"></span></p>
      <a id="result-resume-link" href="#" download>Download résumé</a>
    </section>

    <div id="error" hidden></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
